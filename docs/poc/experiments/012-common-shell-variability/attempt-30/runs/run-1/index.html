<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="app-header">
        <div class="header-leading">
          <button id="drawer-toggle" class="icon-button" type="button" aria-label="Close navigation" title="Close navigation">
            <img id="drawer-icon" src="icons/panel-left-close.svg" alt="">
          </button>
          <span class="workspace-name">業務ワークスペース</span>
        </div>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
          <img id="theme-icon" src="icons/moon.svg" alt="">
        </button>
      </header>
      <div class="shell-body">
        <aside id="drawer" class="drawer" aria-label="Navigation">
          <div class="drawer-search">
            <label for="nav-search">メニューを検索</label>
            <div class="search-field">
              <img src="icons/search.svg" alt="" aria-hidden="true">
              <input id="nav-search" type="search" placeholder="項目を検索" autocomplete="off">
            </div>
          </div>
          <nav id="nav-list" class="nav-list" aria-label="Drawer navigation"></nav>
        </aside>
        <main class="workspace" tabindex="-1">
          <div class="page-grid">
            <h1>スクロール検証用ダミーコンテンツ</h1>
            <ol id="dummy-content" class="dummy-content" aria-label="ダミー連番"></ol>
          </div>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
