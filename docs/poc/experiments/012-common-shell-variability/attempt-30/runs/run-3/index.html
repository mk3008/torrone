<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell" data-theme="light" data-drawer="open">
    <header class="app-header" aria-label="業務ワークスペース ヘッダー">
      <div class="header-leading">
        <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
          <img id="drawer-icon" src="icons/panel-left-close.svg" alt="">
        </button>
        <span class="workspace-name">業務ワークスペース</span>
      </div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
        <img id="theme-icon" src="icons/moon.svg" alt="">
      </button>
    </header>
    <div class="shell-body">
      <aside class="drawer" id="drawer" aria-label="ナビゲーション">
        <div class="drawer-search">
          <label for="navigation-search">メニューを検索</label>
          <div class="search-field"><img src="icons/search.svg" alt=""><input id="navigation-search" type="search" placeholder="項目を検索" autocomplete="off"></div>
        </div>
        <nav class="navigation-list" id="navigation-list" aria-label="固定ナビゲーション"></nav>
      </aside>
      <section class="workspace" aria-label="ワークスペース">
        <div class="workspace-grid">
          <h1>スクロール検証用ダミーコンテンツ</h1>
          <ol class="dummy-list" id="dummy-list" aria-label="連番"></ol>
        </div>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
