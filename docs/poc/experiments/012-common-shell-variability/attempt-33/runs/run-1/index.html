<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-theme="light" data-drawer="open">
      <header class="header" aria-label="共通ヘッダー">
        <div class="header-start">
          <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
            <img id="drawer-icon" src="icons/panel-left-close.svg" alt="">
          </button>
          <span class="workspace-name">業務ワークスペース</span>
        </div>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="ダークテーマに切り替える" title="ダークテーマに切り替える">
          <img id="theme-icon" src="icons/moon.svg" alt="">
        </button>
      </header>
      <div class="shell-body">
        <aside class="drawer" aria-label="ナビゲーション">
          <div class="drawer-tools">
            <label class="search-label" for="navigation-search">ナビゲーションを検索</label>
            <div class="search-wrap">
              <img src="icons/search.svg" alt="" aria-hidden="true">
              <input id="navigation-search" type="search" placeholder="項目を検索" autocomplete="off">
            </div>
          </div>
          <nav class="nav-scroll" aria-label="固定項目">
            <ul id="navigation-list" class="nav-list"></ul>
          </nav>
        </aside>
        <main class="workspace" aria-label="スクロール検証用ダミーコンテンツ" tabindex="-1">
          <div class="page-grid">
            <div class="dummy-label">スクロール検証用ダミーコンテンツ</div>
            <ol id="dummy-content" class="dummy-list" aria-label="1 から 80 までの連番"></ol>
          </div>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
