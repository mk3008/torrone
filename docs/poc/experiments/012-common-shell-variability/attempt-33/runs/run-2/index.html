<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" data-theme="light" data-drawer="open">
    <header class="header" aria-label="共通ヘッダー">
      <div class="header-leading">
        <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
          <img id="drawer-icon" src="icons/panel-left-close.svg" alt="">
        </button>
        <p class="workspace-name">業務ワークスペース</p>
      </div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
        <img id="theme-icon" src="icons/moon.svg" alt="">
      </button>
    </header>
    <div class="shell-body">
      <aside class="drawer" id="drawer" aria-label="ナビゲーション">
        <div class="drawer-search">
          <label for="navigation-search">ナビゲーションを検索</label>
          <div class="search-field"><img src="icons/search.svg" alt=""><input id="navigation-search" type="search" placeholder="項目を検索"></div>
        </div>
        <nav class="navigation-list" id="navigation-list" aria-label="固定ナビゲーション"></nav>
      </aside>
      <main class="workspace" id="workspace" tabindex="-1">
        <div class="page-grid">
          <section class="dummy-content" aria-labelledby="dummy-heading">
            <h1 id="dummy-heading">スクロール検証用ダミーコンテンツ</h1>
            <ol id="dummy-list" aria-label="連番"></ol>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
