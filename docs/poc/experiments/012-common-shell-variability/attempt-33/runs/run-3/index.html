<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell" id="shell">
      <header class="header">
        <div class="header-leading">
          <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
            <img id="drawer-icon" src="icons/panel-left-close.svg" alt="" aria-hidden="true" />
          </button>
        </div>
        <p class="workspace-identity">業務ワークスペース</p>
        <div class="header-end">
          <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
            <img id="theme-icon" src="icons/moon.svg" alt="" aria-hidden="true" />
          </button>
        </div>
      </header>
      <div class="shell-body">
        <aside class="drawer" id="drawer" aria-label="Navigation">
          <div class="drawer-search">
            <label for="navigation-search">ナビゲーションを検索</label>
            <div class="search-control"><img src="icons/search.svg" alt="" aria-hidden="true" /><input id="navigation-search" type="search" placeholder="項目を検索" autocomplete="off" /></div>
          </div>
          <nav class="navigation-list" id="navigation-list" aria-label="固定ナビゲーション"></nav>
        </aside>
        <section class="workspace" aria-labelledby="workspace-title" tabindex="-1">
          <div class="page-grid">
            <h1 id="workspace-title">スクロール検証用ダミーコンテンツ</h1>
            <ol class="dummy-numbers" id="dummy-numbers" aria-label="ダミー連番"></ol>
          </div>
        </section>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
