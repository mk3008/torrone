<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <style>
    :root { color-scheme: light; --page-background:#F4F7FA; --surface-background:#FFFFFF; --text-primary:#172033; --text-muted:#52657A; --border-subtle:#C7D2DF; --border-interactive:#75889C; --selection-background:#F3EAFB; --selection-foreground:#172033; --selection-indicator:#6B3FA0; --focus-ring:#3B82F6; --action-background:#6B3FA0; --action-foreground:#FFFFFF; --link:#6B3FA0; }
    :root[data-theme="dark"] { color-scheme:dark; --page-background:#101820; --surface-background:#1B2632; --text-primary:#F4F7FA; --text-muted:#BAC6D2; --border-subtle:#516273; --border-interactive:#91A3B5; --selection-background:#3A254D; --selection-foreground:#F4F7FA; --selection-indicator:#D5B4FF; --focus-ring:#FFD54A; --action-background:#D5B4FF; --action-foreground:#241335; --link:#D5B4FF; }
    * { box-sizing:border-box; } html,body { height:100%; margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--page-background); color:var(--text-primary); }
    button,input { font:inherit; } button { color:inherit; } button:focus-visible,input:focus-visible,a:focus-visible { outline:2px solid var(--focus-ring); outline-offset:3px; }
    .app { height:100%; display:grid; grid-template-rows:60px minmax(0,1fr); }
    header { display:flex; align-items:center; gap:12px; padding:0 18px; background:var(--surface-background); color:var(--text-primary); border-bottom:1px solid var(--border-subtle); position:relative; z-index:2; }
    .icon-button { width:36px; height:36px; display:grid; place-items:center; padding:0; border:1px solid var(--border-interactive); background:var(--surface-background); border-radius:6px; cursor:pointer; }
    .icon-button svg { width:20px; height:20px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .workspace-name { margin:0; font-size:16px; font-weight:700; letter-spacing:.01em; } .header-spacer { flex:1; }
    .shell { min-height:0; display:grid; grid-template-columns:272px minmax(0,1fr); } .shell.drawer-hidden { grid-template-columns:minmax(0,1fr); }
    aside { min-height:0; background:var(--surface-background); border-right:1px solid var(--border-subtle); display:grid; grid-template-rows:auto minmax(0,1fr); }
    .drawer-search { padding:16px 14px 12px; border-bottom:1px solid var(--border-subtle); } label { display:block; margin-bottom:7px; font-size:13px; font-weight:650; } input { width:100%; height:36px; padding:0 10px; border:1px solid var(--border-interactive); border-radius:5px; background:var(--surface-background); color:var(--text-primary); }
    nav { overflow-y:auto; padding:8px 0 16px; } .nav-row { width:100%; min-height:38px; position:relative; display:flex; align-items:center; gap:7px; padding:8px 16px; border:0; background:transparent; text-align:left; cursor:pointer; } .nav-row:hover { background:color-mix(in srgb,var(--selection-background) 55%,transparent); }
    .nav-row.current { background:var(--selection-background); color:var(--selection-foreground); font-weight:700; } .nav-row.current::before { content:""; position:absolute; inset-block:0; left:0; width:4px; background:var(--selection-indicator); }
    .nav-row.child { padding-left:38px; } .disclosure { margin-left:auto; display:grid; place-items:center; width:20px; height:20px; } .disclosure svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .children[hidden], .filtered-out { display:none; } .no-matches { padding:16px; color:var(--text-muted); font-size:14px; }
    main { overflow-y:auto; min-width:0; padding:clamp(22px,4vw,54px); } .neutral-content { max-width:760px; margin:0 auto; } h1 { margin:0 0 24px; font-size:clamp(20px,3vw,28px); font-weight:700; } .numbers { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:10px; } .number { display:grid; place-items:center; height:44px; border:1px solid var(--border-subtle); border-radius:4px; background:var(--surface-background); color:var(--text-primary); font-variant-numeric:tabular-nums; }
    @media (max-width:700px) { .shell { grid-template-columns:minmax(0,1fr); position:relative; } aside { position:absolute; z-index:3; inset:0 auto 0 0; width:min(82vw,300px); box-shadow:8px 0 22px rgb(0 0 0 / .18); } .shell.drawer-hidden aside { display:none; } main { padding:24px 18px; } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header aria-label="共通ヘッダー">
      <button class="icon-button" id="drawerToggle" type="button" title="Close navigation" aria-label="Close navigation"></button>
      <p class="workspace-name">業務ワークスペース</p><span class="header-spacer"></span>
      <button class="icon-button" id="themeToggle" type="button" title="Dark mode" aria-label="Dark mode"></button>
    </header>
    <div class="shell" id="shell">
      <aside id="drawer" aria-label="ナビゲーション">
        <div class="drawer-search"><label for="navSearch">メニューを検索</label><input id="navSearch" type="search" placeholder="項目を検索" autocomplete="off"></div>
        <nav id="navigation" aria-label="固定メニュー"></nav>
      </aside>
      <main tabindex="-1"><div class="neutral-content"><h1>スクロール検証用ダミーコンテンツ</h1><div class="numbers" id="numbers"></div></div></main>
    </div>
  </div>
  <script>
    const icons={panelClose:'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM9 5v14M15 9l-3 3 3 3"/></svg>',panelOpen:'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM9 5v14M12 9l3 3-3 3"/></svg>',moon:'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8z"/></svg>',sun:'<svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',down:'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',right:'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>'};
    const params=new URLSearchParams(location.search); let drawerOpen=params.get('drawer')!=='hidden'; let theme=params.get('theme')==='dark'?'dark':'light'; let expanded=true; let current='項目 01-01';
    const app=document.documentElement, shell=document.querySelector('#shell'), nav=document.querySelector('#navigation'), drawerButton=document.querySelector('#drawerToggle'), themeButton=document.querySelector('#themeToggle'), search=document.querySelector('#navSearch');
    const items=['項目 02','項目 03','項目 04','項目 05','項目 06','項目 07','項目 08','項目 09','項目 10','項目 11','項目 12','項目 13','項目 14','項目 15','項目 16','項目 17','項目 18','項目 19','項目 20','項目 21','項目 22','項目 23','項目 24','項目 25','項目 26','項目 27','項目 28','項目 29','項目 30'];
    document.querySelector('#numbers').innerHTML=Array.from({length:80},(_,i)=>`<div class="number">${i+1}</div>`).join('');
    function setShell(){ app.dataset.theme=theme; shell.classList.toggle('drawer-hidden',!drawerOpen); drawerButton.innerHTML=drawerOpen?icons.panelClose:icons.panelOpen; drawerButton.title=drawerButton.getAttribute('aria-label')=drawerOpen?'Close navigation':'Open navigation'; themeButton.innerHTML=theme==='light'?icons.moon:icons.sun; themeButton.title=themeButton.getAttribute('aria-label')=theme==='light'?'Dark mode':'Light mode'; }
    function row(label,child=false){const b=document.createElement('button'); b.type='button'; b.className='nav-row'+(child?' child':'')+(current===label?' current':''); b.textContent=label; b.setAttribute('aria-current',current===label?'page':'false'); b.addEventListener('click',()=>{current=label; render();}); return b;}
    function render(){ const q=search.value.trim(); nav.innerHTML=''; const parent=document.createElement('button'); parent.type='button'; parent.className='nav-row'; parent.textContent='グループ 01'; parent.setAttribute('aria-expanded',String(expanded)); const chevron=document.createElement('span'); chevron.className='disclosure'; chevron.innerHTML=expanded?icons.down:icons.right; parent.append(chevron); parent.addEventListener('click',()=>{expanded=!expanded;render();}); const children=document.createElement('div'); children.className='children'; if(!expanded)children.hidden=true; ['項目 01-01','項目 01-02'].forEach(x=>children.append(row(x,true))); const ordinary=items.map(x=>row(x)); const all=[parent,...children.children,...ordinary]; if(q){let matched=0; all.slice(1).forEach(node=>{if(node.textContent.includes(q)){matched++;}else node.classList.add('filtered-out');}); if(matched){parent.classList.remove('filtered-out'); children.hidden=false;}else{parent.classList.add('filtered-out'); children.hidden=true; const empty=document.createElement('p');empty.className='no-matches';empty.textContent='一致する項目はありません。';nav.append(empty);return;}} nav.append(parent,children,...ordinary); }
    drawerButton.addEventListener('click',()=>{drawerOpen=!drawerOpen;setShell();}); themeButton.addEventListener('click',()=>{theme=theme==='light'?'dark':'light';setShell();}); search.addEventListener('input',render); setShell(); render();
  </script>
</body>
</html>
