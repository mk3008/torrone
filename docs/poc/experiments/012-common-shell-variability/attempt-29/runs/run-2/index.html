<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" data-theme="light">
    <header class="app-header">
      <div class="header-leading">
        <button id="drawer-toggle" class="icon-button" type="button" title="Close navigation" aria-label="Close navigation" aria-expanded="true">
          <img id="drawer-icon" src="icons/panel-left-close.svg" alt="">
        </button>
        <strong>業務ワークスペース</strong>
      </div>
      <button id="theme-toggle" class="icon-button" type="button" title="Switch to dark theme" aria-label="Switch to dark theme">
        <img id="theme-icon" src="icons/moon.svg" alt="">
      </button>
    </header>
    <div class="shell-body">
      <aside id="drawer" class="drawer" aria-label="ナビゲーション">
        <div class="drawer-search">
          <label for="nav-search">メニューを検索</label>
          <div class="search-field"><img src="icons/search.svg" alt=""><input id="nav-search" type="search" placeholder="メニューを検索"></div>
        </div>
        <nav id="navigation" class="navigation" aria-label="固定項目"></nav>
      </aside>
      <main class="workspace">
        <section class="content-pane" aria-labelledby="workspace-title">
          <h1 id="workspace-title">スクロール検証用ダミーコンテンツ</h1>
          <ol id="dummy-list" aria-label="ダミー連番"></ol>
        </section>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
