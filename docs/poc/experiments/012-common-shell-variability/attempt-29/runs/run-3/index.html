<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" data-theme="light">
    <header class="app-header">
      <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation"><img id="drawer-icon" src="icons/panel-left-close.svg" alt=""></button>
      <strong class="workspace-name">業務ワークスペース</strong>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to Dark theme" title="Switch to Dark theme"><img id="theme-icon" src="icons/moon.svg" alt=""></button>
    </header>
    <div class="shell-body">
      <aside class="drawer" id="drawer" aria-label="ナビゲーション">
        <label class="search-label" for="nav-search">メニューを検索</label>
        <div class="search-wrap"><img src="icons/search.svg" alt=""><input id="nav-search" type="search" placeholder="項目を検索" autocomplete="off"></div>
        <nav class="nav-list" id="nav-list" aria-label="固定メニュー"></nav>
        <p class="no-matches" id="no-matches" hidden>一致する項目はありません</p>
      </aside>
      <main class="workspace" id="workspace" tabindex="-1">
        <div class="page-grid"><section class="content-pane"><h1>スクロール検証用ダミーコンテンツ</h1><ol id="dummy-list" aria-label="意味を持たない連番"></ol></section></div>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
