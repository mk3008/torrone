<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-theme="light">
      <header class="header" aria-label="業務ワークスペースの共通ヘッダー">
        <div class="header-leading">
          <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
            <img id="drawer-icon" src="icons/panel-left-close.svg" alt="" aria-hidden="true">
          </button>
          <span class="workspace-name">業務ワークスペース</span>
        </div>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
          <img id="theme-icon" src="icons/moon.svg" alt="" aria-hidden="true">
        </button>
      </header>
      <div class="shell-body">
        <aside class="drawer" id="drawer" aria-label="ナビゲーション">
          <div class="drawer-tools">
            <label for="nav-search">メニューを検索</label>
            <div class="search-field">
              <img src="icons/search.svg" alt="" aria-hidden="true">
              <input id="nav-search" type="search" placeholder="項目を検索" autocomplete="off">
            </div>
          </div>
          <nav class="nav-list" id="nav-list" aria-label="固定メニュー"></nav>
        </aside>
        <main class="workspace" id="workspace" tabindex="-1">
          <div class="page-grid">
            <section class="bounded-content" aria-labelledby="dummy-heading">
              <h1 id="dummy-heading">スクロール検証用ダミーコンテンツ</h1>
              <ol class="dummy-list" id="dummy-list" aria-label="ダミー連番"></ol>
            </section>
          </div>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
