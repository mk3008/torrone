<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業務ワークスペース</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="shell" data-theme="light">
  <header class="header"><div class="header-start">
    <button id="drawer-button" class="icon-button" type="button" aria-label="Close navigation" title="Close navigation">
      <svg class="panel-close" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18m7-6-3-3 3-3"/></svg>
      <svg class="panel-open" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18m4 6 3-3-3-3"/></svg>
    </button><span class="workspace-name">業務ワークスペース</span>
  </div><button id="theme-button" class="icon-button" type="button" aria-label="ダークテーマに切り替え" title="ダークテーマに切り替え">
    <svg class="moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.4 14.3A8.6 8.6 0 0 1 9.7 3.6 8.6 8.6 0 1 0 20.4 14.3z"/></svg>
    <svg class="sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button></header>
  <div class="shell-body"><aside class="drawer" aria-label="ナビゲーション"><div class="search-area">
    <label for="nav-search">メニューを検索</label><div class="search-field"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m14.7 14.7 4.3 4.3"/></svg><input id="nav-search" type="search" placeholder="項目名を検索"></div>
  </div><nav class="nav-list" aria-label="メニュー"><div class="nav-group">
    <button class="nav-row parent" type="button" aria-expanded="true"><span>グループ 01</span><svg class="chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="children"><button class="nav-row child selected" type="button" aria-current="page">項目 01-01</button><button class="nav-row child" type="button">項目 01-02</button></div>
  </div><div id="leaves"></div><p id="empty-search" hidden>一致する項目はありません</p></nav></aside>
  <main class="workspace" tabindex="-1"><div class="workspace-content"><h1>スクロール検証用ダミーコンテンツ</h1><ol id="sequence" aria-label="連番"></ol></div></main></div>
</div><script src="app.js"></script></body></html>
