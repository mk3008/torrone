<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app" data-theme="light" data-drawer-open="true">
      <header class="header">
        <button class="icon-button" id="drawer-button" type="button" aria-controls="drawer" aria-expanded="true" aria-label="Close navigation" title="Close navigation">
          <svg class="panel-left-close" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
          <svg class="panel-left-open" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m13 9 3 3-3 3"/></svg>
        </button>
        <strong>業務ワークスペース</strong>
        <button class="icon-button" id="theme-button" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.2A8.7 8.7 0 0 1 8.8 3.6 8.7 8.7 0 1 0 20.4 15.2Z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>
      <div class="shell-body">
        <aside class="drawer" id="drawer" aria-label="ナビゲーション">
          <div class="search-area">
            <label for="nav-search">メニューを検索</label>
            <div class="search-control" id="search-control">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15.1 15.1 4.4 4.4"/></svg>
              <input id="nav-search" type="search" autocomplete="off" placeholder="項目を検索">
            </div>
          </div>
          <nav class="nav-list" aria-label="メニュー">
            <section class="nav-group" id="group">
              <button class="nav-row parent" id="parent-button" type="button" aria-expanded="true">
                <span>グループ 01</span>
                <svg class="chevron-down" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                <svg class="chevron-right" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
              </button>
              <div id="children">
                <button class="nav-row child selected" type="button" aria-current="page"><span class="selection-indicator" aria-hidden="true"></span><span>項目 01-01</span></button>
                <button class="nav-row child" type="button">項目 01-02</button>
              </div>
            </section>
            <div id="leaves"></div>
            <p id="empty-message" hidden>一致する項目はありません</p>
          </nav>
        </aside>
        <main class="workspace">
          <h1>スクロール検証用ダミーコンテンツ</h1>
          <ol id="sequence" aria-label="スクロール検証用ダミーコンテンツ"></ol>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
