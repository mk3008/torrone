<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell" data-theme="light">
      <header class="header">
        <div class="header__leading">
          <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
            <img id="drawer-icon" src="icons/panel-left-close.svg" alt="" />
          </button>
          <p class="workspace-name">業務ワークスペース</p>
        </div>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <img id="theme-icon" src="icons/moon.svg" alt="" />
        </button>
      </header>

      <div class="shell-body">
        <aside class="drawer" id="drawer" aria-label="Navigation">
          <div class="drawer-search">
            <label for="nav-search">メニューを検索</label>
            <div class="search-field">
              <img src="icons/search.svg" alt="" />
              <input id="nav-search" type="search" placeholder="項目を検索" autocomplete="off" />
            </div>
          </div>
          <nav class="navigation" aria-label="メニュー">
            <ul class="nav-list" id="nav-list"></ul>
            <p class="no-matches" id="no-matches" hidden>一致する項目はありません</p>
          </nav>
        </aside>
        <main class="workspace" tabindex="-1">
          <section class="workspace-content" aria-labelledby="workspace-heading">
            <h1 id="workspace-heading">スクロール検証用ダミーコンテンツ</h1>
            <ol class="dummy-list" id="dummy-list" aria-label="ダミー連番"></ol>
          </section>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
