<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell theme-light" id="shell">
      <header class="app-header">
        <div class="header-leading">
          <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
            <img id="drawer-icon" src="assets/panel-left-close.svg" alt="">
          </button>
          <span class="workspace-name">業務ワークスペース</span>
        </div>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to Dark mode" title="Switch to Dark mode">
          <img id="theme-icon" src="assets/moon.svg" alt="">
        </button>
      </header>

      <div class="shell-body">
        <aside class="drawer" id="drawer" aria-label="ナビゲーション">
          <div class="drawer-search">
            <label for="nav-search">メニューを検索</label>
            <div class="search-field">
              <img src="assets/search.svg" alt="">
              <input id="nav-search" type="search" placeholder="項目を検索" autocomplete="off">
            </div>
          </div>
          <nav class="navigation-list" id="navigation-list" aria-label="メニュー"></nav>
        </aside>

        <main class="workspace" id="workspace">
          <section class="neutral-content" aria-labelledby="workspace-title">
            <h1 id="workspace-title">スクロール検証用ダミーコンテンツ</h1>
            <ol class="number-list" id="number-list" aria-label="1 から 80 の連番"></ol>
          </section>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
