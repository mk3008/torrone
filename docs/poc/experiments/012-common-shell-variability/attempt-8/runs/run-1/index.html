<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" data-theme="light">
    <header class="header">
      <button id="drawer-control" class="icon-control" type="button" aria-controls="drawer" aria-expanded="true" aria-label="Close navigation" title="Close navigation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx=".5"/><path d="M9 4.5v15"/></svg>
      </button>
      <span class="identity">業務ワークスペース</span>
      <button id="theme-control" class="icon-control" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 15.2A8.6 8.6 0 0 1 8.8 4.6a8.6 8.6 0 1 0 10.6 10.6Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.8"/><path d="M12 2v2.3M12 19.7V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.3M19.7 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
      </button>
    </header>
    <div class="body-row">
      <aside id="drawer" class="drawer" aria-label="ナビゲーション">
        <div class="drawer-search">
          <label for="navigation-search">メニューを検索</label>
          <div class="input-frame" id="search-frame">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m14.7 14.7 4.5 4.5"/></svg>
            <input id="navigation-search" type="search" autocomplete="off" placeholder="項目名を入力">
          </div>
        </div>
        <nav class="navigation" aria-label="メニュー">
          <section class="group" id="group-01">
            <button id="group-toggle" class="nav-row parent-row" type="button" aria-expanded="true">
              <span>グループ 01</span>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </button>
            <div id="group-children">
              <button class="nav-row child selected" type="button" aria-current="page"><span class="current-bar" aria-hidden="true"></span><span>項目 01-01</span></button>
              <button class="nav-row child" type="button"><span>項目 01-02</span></button>
            </div>
          </section>
          <div id="leaf-items"></div>
          <p id="no-matches" hidden>一致する項目はありません</p>
        </nav>
      </aside>
      <main class="workspace">
        <h1>スクロール検証用ダミーコンテンツ</h1>
        <ol id="numbers" aria-label="スクロール検証用ダミーコンテンツ"></ol>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
