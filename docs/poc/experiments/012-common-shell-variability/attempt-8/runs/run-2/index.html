<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" data-theme="light">
    <header class="header">
      <div class="header-start">
        <button id="drawer-control" class="icon-control" type="button" aria-label="Close navigation" title="Close navigation">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx=".5"/><path d="M9 4.5v15M12 9h5M12 12h5M12 15h5"/></svg>
        </button>
        <span class="identity">業務ワークスペース</span>
      </div>
      <button id="theme-control" class="icon-control" type="button" aria-label="ダークテーマに切り替え" title="ダークテーマに切り替え">
        <svg class="moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.4 14.3A8.6 8.6 0 0 1 9.7 3.6 8.6 8.6 0 1 0 20.4 14.3z"/></svg>
        <svg class="sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M2 12h2.2M19.8 12H22M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5"/></svg>
      </button>
    </header>
    <div class="below-header">
      <aside class="drawer" aria-label="ナビゲーション">
        <div class="search-region">
          <label for="drawer-search">メニューを検索</label>
          <div class="search-box">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m14.7 14.7 4.3 4.3"/></svg>
            <input id="drawer-search" type="search" placeholder="項目名を入力">
          </div>
        </div>
        <nav class="navigation" aria-label="メニュー">
          <div class="group">
            <button class="nav-item parent" type="button" aria-expanded="true"><span>グループ 01</span><span class="disclosure" aria-hidden="true">⌄</span></button>
            <div class="group-children">
              <button class="nav-item child is-current" type="button" aria-current="page">項目 01-01</button>
              <button class="nav-item child" type="button">項目 01-02</button>
            </div>
          </div>
          <div id="leaf-items"></div>
          <p id="no-matches" hidden>一致する項目はありません</p>
        </nav>
      </aside>
      <main class="workspace" tabindex="-1">
        <div class="workspace-inner">
          <h1>スクロール検証用ダミーコンテンツ</h1>
          <ol id="numbers" aria-label="連番"></ol>
        </div>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
