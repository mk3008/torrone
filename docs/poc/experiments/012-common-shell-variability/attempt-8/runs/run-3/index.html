<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-drawer="open" data-theme="light">
      <header class="header">
        <button class="icon-control drawer-control" type="button" aria-label="Close navigation" title="Close navigation">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1"/><path d="M9 4.5v15M13 9h4M13 13h4"/></svg>
        </button>
        <span class="workspace-name">業務ワークスペース</span>
        <button class="icon-control theme-control" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
          <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 15.1A8.6 8.6 0 0 1 8.9 4 8.6 8.6 0 1 0 20 15.1Z"/></svg>
          <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8"/><path d="M12 2v2.4M12 19.6V22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2 12h2.4M19.6 12H22M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
        </button>
      </header>
      <div class="regions">
        <aside class="drawer" aria-label="Navigation">
          <section class="drawer-search" aria-label="メニュー検索">
            <label for="navigation-search">メニューを検索</label>
            <div class="search-control">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></svg>
              <input id="navigation-search" type="search" placeholder="項目名で絞り込み" autocomplete="off">
            </div>
          </section>
          <nav class="navigation-list" aria-label="メニュー"></nav>
        </aside>
        <main class="workspace">
          <h1>スクロール検証用ダミーコンテンツ</h1>
          <ol class="sequence" aria-label="1 から 80 の連番"></ol>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
