<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" id="shell" data-theme="light">
      <header class="app-header">
        <button class="icon-button" id="drawer-toggle" type="button" aria-controls="drawer" aria-label="Close navigation" title="Close navigation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"></rect><path d="M9 4v16"></path><path d="m16 9-3 3 3 3"></path></svg>
        </button>
        <h1>業務ワークスペース</h1>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg viewBox="0 0 24 24" aria-hidden="true" id="theme-icon"><path d="M20.5 15.1A8.5 8.5 0 0 1 8.9 3.5 8.5 8.5 0 1 0 20.5 15.1Z"></path></svg>
        </button>
      </header>
      <div class="shell-body">
        <aside class="drawer" id="drawer" aria-label="Navigation">
          <div class="drawer-search">
            <label for="nav-search">メニューを検索</label>
            <div class="search-field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"></circle><path d="m15 15 4.5 4.5"></path></svg>
              <input id="nav-search" type="search" autocomplete="off" placeholder="項目名で絞り込み">
              <button id="clear-search" class="clear-button" type="button" aria-label="Clear menu search" title="Clear menu search" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
              </button>
            </div>
          </div>
          <nav class="nav-scroll" aria-label="固定メニュー">
            <div id="nav-items"></div>
            <p class="no-matches" id="no-matches" hidden>一致する項目はありません</p>
          </nav>
        </aside>
        <main class="workspace" aria-labelledby="workspace-title">
          <section class="workspace-content">
            <h2 id="workspace-title">スクロール検証用ダミーコンテンツ</h2>
            <ol class="sequence" id="sequence" aria-label="連番"></ol>
          </section>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
