<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" data-theme="light" data-drawer="open">
    <header class="header" aria-label="共通ヘッダー">
      <button class="icon-button drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
        <svg class="panel-icon panel-close" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"></rect><path d="M9 3v18"></path><path d="M16 8l-4 4 4 4"></path></svg>
        <svg class="panel-icon panel-open" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"></rect><path d="M9 3v18"></path><path d="M12 8l4 4-4 4"></path></svg>
      </button>
      <div class="workspace-name">業務ワークスペース</div>
      <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="theme-icon moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.1A8.6 8.6 0 0 1 8.9 4 8.5 8.5 0 1 0 20 15.1Z"></path></svg>
        <svg class="theme-icon sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg>
      </button>
    </header>
    <div class="shell-body">
      <aside class="drawer" aria-label="ナビゲーション">
        <div class="drawer-search">
          <label for="navigation-search">メニューを検索</label>
          <div class="search-field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"></circle><path d="m15 15 4.5 4.5"></path></svg>
            <input id="navigation-search" type="search" autocomplete="off" placeholder="項目名を入力">
            <button class="clear-search" type="button" aria-label="検索をクリア" title="検索をクリア">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
            </button>
          </div>
        </div>
        <nav class="nav-scroll" aria-label="固定メニュー">
          <ul class="nav-list"></ul>
          <p class="no-matches" hidden>一致する項目はありません</p>
        </nav>
      </aside>
      <main class="workspace" tabindex="-1">
        <section class="workspace-content" aria-labelledby="scroll-heading">
          <h1 id="scroll-heading">スクロール検証用ダミーコンテンツ</h1>
          <ol class="numbers" aria-label="連番"></ol>
        </section>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
