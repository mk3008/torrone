<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" id="shell">
    <header class="header">
      <button class="icon-button" id="drawerToggle" type="button" aria-label="Close navigation" title="Close navigation"></button>
      <div class="workspace-name">業務ワークスペース</div>
      <button class="icon-button theme-button" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
    </header>
    <div class="body-layout">
      <aside class="drawer" id="drawer" aria-label="Navigation">
        <div class="drawer-tools">
          <label for="navSearch">メニューを検索</label>
          <div class="search-field">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.6" cy="10.6" r="5.8"></circle><path d="m15.1 15.1 4.4 4.4"></path></svg>
            <input id="navSearch" type="search" placeholder="項目名を検索" autocomplete="off">
            <button id="clearSearch" class="clear-search" type="button" aria-label="検索をクリア" title="検索をクリア">×</button>
          </div>
        </div>
        <nav class="nav-scroll" id="navList" aria-label="メニュー"></nav>
      </aside>
      <main class="workspace" aria-label="ワークスペース">
        <section class="workspace-content" aria-labelledby="workspace-title">
          <h1 id="workspace-title">スクロール検証用ダミーコンテンツ</h1>
          <ol class="number-list" id="numbers" aria-label="1から80"></ol>
        </section>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
