<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-theme="light">
      <header class="header">
        <button id="drawer-button" class="icon-control" type="button" aria-label="Close navigation" title="Close navigation">
          <svg class="panel-close" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"></rect><path d="M10 4v16"></path><path d="m15 8-4 4 4 4"></path></svg>
          <svg class="panel-open" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"></rect><path d="M10 4v16"></path><path d="m11 8 4 4-4 4"></path></svg>
        </button>
        <h1>業務ワークスペース</h1>
        <button id="theme-button" class="icon-control theme-control" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"></path></svg>
          <svg class="sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </button>
      </header>
      <div class="body-grid">
        <aside class="drawer" aria-label="Navigation">
          <div class="search-area">
            <label for="drawer-search">メニューを検索</label>
            <div class="search-box">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="5.5"></circle><path d="m14.5 14.5 5 5"></path></svg>
              <input id="drawer-search" type="search" placeholder="項目を検索" autocomplete="off">
              <button id="clear-search" type="button" aria-label="Clear menu search" title="Clear menu search">×</button>
            </div>
          </div>
          <nav class="navigation" aria-label="Workspace navigation"><ul id="navigation-list"></ul></nav>
        </aside>
        <main class="workspace" tabindex="-1">
          <h2>スクロール検証用ダミーコンテンツ</h2>
          <ol id="numbers" aria-label="連番"></ol>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
