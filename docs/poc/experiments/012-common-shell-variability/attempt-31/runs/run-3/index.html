<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" data-theme="light" data-drawer="open">
    <header class="header" aria-label="共通ヘッダー">
      <div class="header-leading">
        <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
          <img id="drawer-icon" src="icons/panel-left-close.svg" alt="" aria-hidden="true">
        </button>
        <strong class="workspace-name">業務ワークスペース</strong>
      </div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to Dark" title="Switch to Dark">
        <img id="theme-icon" src="icons/moon.svg" alt="" aria-hidden="true">
      </button>
    </header>

    <div class="shell-body">
      <aside class="drawer" id="drawer" aria-label="ナビゲーション">
        <div class="drawer-search">
          <label for="nav-search">メニュー検索</label>
          <div class="search-field">
            <img src="icons/search.svg" alt="" aria-hidden="true">
            <input id="nav-search" type="search" placeholder="項目を検索" autocomplete="off">
          </div>
        </div>
        <nav class="nav-list" aria-label="固定メニュー">
          <div id="navigation"></div>
          <p id="no-matches" class="no-matches" hidden>一致する項目はありません</p>
        </nav>
      </aside>

      <main class="workspace" aria-label="ワークスペース">
        <div class="workspace-grid">
          <h1>スクロール検証用ダミーコンテンツ</h1>
          <ol class="number-list" aria-label="ダミー連番" id="number-list"></ol>
        </div>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
