<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" data-theme="light" data-drawer="open">
    <header class="header">
      <button class="icon-button drawer-control" type="button" aria-label="Close navigation" title="Close navigation">
        <img src="icons/panel-left-close.svg" alt="" aria-hidden="true">
      </button>
      <p class="workspace-name">業務ワークスペース</p>
      <button class="icon-button theme-control" type="button" aria-label="Switch to Dark" title="Switch to Dark">
        <img src="icons/moon.svg" alt="" aria-hidden="true">
      </button>
    </header>
    <div class="shell-body">
      <aside class="drawer" aria-label="Navigation">
        <div class="drawer-tools">
          <label for="nav-search">メニューを検索</label>
          <div class="search-wrap"><img src="icons/search.svg" alt="" aria-hidden="true"><input id="nav-search" type="search" placeholder="メニュー項目を検索"></div>
        </div>
        <nav class="nav-list" aria-label="Drawer navigation"></nav>
      </aside>
      <main class="workspace" tabindex="-1">
        <div class="page-grid">
          <h1>スクロール検証用ダミーコンテンツ</h1>
          <ol class="dummy-list" aria-label="無意味な連番"></ol>
        </div>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
