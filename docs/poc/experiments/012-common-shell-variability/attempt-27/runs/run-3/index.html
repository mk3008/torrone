<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-theme="light">
      <header class="app-header">
        <div class="header-leading">
          <button class="icon-button" id="drawer-toggle" type="button" aria-controls="navigation-drawer" aria-expanded="true" title="Close navigation">
            <img id="drawer-icon" src="icons/panel-left-close.svg" alt="">
            <span class="visually-hidden" id="drawer-toggle-label">Close navigation</span>
          </button>
          <h1>業務ワークスペース</h1>
        </div>
        <button class="icon-button" id="theme-toggle" type="button" title="Switch to dark theme">
          <img id="theme-icon" src="icons/moon.svg" alt="">
          <span class="visually-hidden" id="theme-toggle-label">Switch to dark theme</span>
        </button>
      </header>

      <div class="shell-body">
        <aside class="drawer" id="navigation-drawer" aria-label="ナビゲーション">
          <div class="drawer-search">
            <label for="nav-search">メニューを検索</label>
            <div class="search-field">
              <img src="icons/search.svg" alt="">
              <input id="nav-search" type="search" placeholder="項目を検索" autocomplete="off">
            </div>
          </div>
          <nav class="navigation-list" aria-label="固定メニュー">
            <div id="navigation-items"></div>
            <p class="no-matches" id="no-matches" hidden>一致する項目はありません</p>
          </nav>
        </aside>

        <main class="workspace" id="workspace" tabindex="-1">
          <div class="page-grid">
            <section class="neutral-content" aria-labelledby="workspace-title">
              <h2 id="workspace-title">スクロール検証用ダミーコンテンツ</h2>
              <ol class="number-list" id="number-list" aria-label="1 から 80 までの連番"></ol>
            </section>
          </div>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
