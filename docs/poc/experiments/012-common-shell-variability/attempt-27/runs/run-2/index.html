<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-theme="light">
      <header class="header">
        <div class="header-leading">
          <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
            <img id="drawer-icon" src="icons/panel-left-close.svg" alt="">
          </button>
          <strong>業務ワークスペース</strong>
        </div>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
          <img id="theme-icon" src="icons/moon.svg" alt="">
        </button>
      </header>
      <div class="body-layout">
        <aside class="drawer" id="drawer" aria-label="Navigation">
          <div class="drawer-search">
            <label for="navigation-search">メニューを検索</label>
            <div class="search-control"><img src="icons/search.svg" alt=""><input id="navigation-search" type="search" placeholder="メニューを検索"></div>
          </div>
          <nav class="navigation" aria-label="Drawer navigation">
            <div class="nav-list" id="nav-list"></div>
            <p class="no-matches" id="no-matches" hidden>一致する項目はありません</p>
          </nav>
        </aside>
        <main class="workspace" tabindex="-1">
          <section class="workspace-content" aria-labelledby="workspace-title">
            <h1 id="workspace-title">スクロール検証用ダミーコンテンツ</h1>
            <ol class="sequence" id="sequence" aria-label="1から80までの連番"></ol>
          </section>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
