<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell" data-theme="light">
      <header class="header">
        <button class="icon-button drawer-control" type="button" aria-label="Close navigation" title="Close navigation">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14M15 9l-3 3 3 3" /></svg>
        </button>
        <p class="workspace-name">業務ワークスペース</p>
        <button class="icon-button theme-control" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.6 6.6 0 0 0 21 12.8z" /></svg>
        </button>
      </header>
      <div class="shell-body">
        <aside class="drawer" aria-label="Navigation">
          <div class="drawer-search">
            <label for="navigation-search">メニューを検索</label>
            <div class="input-wrap">
              <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" /><path d="m16 16 4 4" /></svg>
              <input id="navigation-search" type="search" placeholder="項目を検索" autocomplete="off" />
            </div>
          </div>
          <nav class="navigation-list" aria-label="Drawer navigation"></nav>
        </aside>
        <main class="workspace" tabindex="-1">
          <section class="workspace-content" aria-labelledby="workspace-heading">
            <h1 id="workspace-heading">スクロール検証用ダミーコンテンツ</h1>
            <ol class="dummy-list" aria-label="スクロール検証用連番"></ol>
          </section>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
