<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell" id="shell">
      <header class="header">
        <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="lucide panel-close"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
          <svg aria-hidden="true" viewBox="0 0 24 24" class="lucide panel-open"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m13 9 3 3-3 3"/></svg>
        </button>
        <p class="workspace-name">業務ワークスペース</p>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="lucide moon"><path d="M12 3a6.8 6.8 0 1 0 9 9A9 9 0 1 1 12 3Z"/></svg>
          <svg aria-hidden="true" viewBox="0 0 24 24" class="lucide sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </header>

      <div class="body-layout">
        <aside class="drawer" id="drawer" aria-label="Navigation">
          <div class="drawer-search">
            <label for="nav-search">メニューを検索</label>
            <div class="search-control">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="lucide"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="nav-search" type="search" autocomplete="off" placeholder="項目を検索" />
            </div>
          </div>
          <nav class="nav-list" aria-label="固定メニュー">
            <div class="nav-group" id="nav-group">
              <button class="nav-row nav-parent" id="group-toggle" type="button" aria-expanded="true">
                <span>グループ 01</span>
                <svg aria-hidden="true" viewBox="0 0 24 24" class="lucide disclosure"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="nav-children" id="nav-children">
                <button class="nav-row nav-child" type="button" data-item="項目 01-01">項目 01-01</button>
                <button class="nav-row nav-child" type="button" data-item="項目 01-02">項目 01-02</button>
              </div>
            </div>
            <div id="nav-leaves"></div>
            <p class="no-matches" id="no-matches" hidden>一致する項目はありません</p>
          </nav>
        </aside>

        <main class="workspace" aria-label="Workspace">
          <section class="workspace-content" aria-labelledby="workspace-heading">
            <h1 id="workspace-heading">スクロール検証用ダミーコンテンツ</h1>
            <ol class="sequence" id="sequence" aria-label="1から80までの連番"></ol>
          </section>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
