<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" data-theme="light" data-drawer="open">
    <header class="app-header">
      <div class="header-leading">
        <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
          <img id="drawer-icon" src="icons/panel-left-close.svg" alt="">
        </button>
        <strong class="workspace-identity">業務ワークスペース</strong>
      </div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
        <img id="theme-icon" src="icons/moon.svg" alt="">
      </button>
    </header>
    <div class="shell-body">
      <aside class="drawer" aria-label="Navigation">
        <div class="drawer-search">
          <label for="nav-search">メニューを検索</label>
          <div class="search-control"><img src="icons/search.svg" alt=""><input id="nav-search" type="search" placeholder="項目を検索"></div>
        </div>
        <nav class="navigation" aria-label="業務ワークスペースのナビゲーション">
          <div id="nav-list" class="nav-list"></div>
          <p id="no-results" class="no-results" hidden>一致する項目はありません</p>
        </nav>
      </aside>
      <main class="workspace" tabindex="-1">
        <div class="page-grid">
          <h1>スクロール検証用ダミーコンテンツ</h1>
          <ol id="dummy-list" class="dummy-list" aria-label="ダミー連番"></ol>
        </div>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
