<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" id="shell">
      <header class="app-header">
        <button class="icon-button" id="drawer-toggle" type="button" aria-label="Drawerを閉じる" title="Drawerを閉じる">
          <span aria-hidden="true">☰</span>
        </button>
        <p class="workspace-name">業務ワークスペース</p>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="ダークテーマに切り替える" title="ダークテーマに切り替える">
          <span id="theme-icon" aria-hidden="true">◐</span>
        </button>
      </header>

      <div class="app-body">
        <aside class="drawer" id="drawer" aria-label="ナビゲーション">
          <div class="drawer-search">
            <label class="sr-only" for="menu-search">メニューを検索</label>
            <div class="search-field">
              <input id="menu-search" type="search" placeholder="メニューを検索" autocomplete="off">
              <button id="clear-search" type="button" aria-label="検索をクリア" title="検索をクリア" hidden>×</button>
            </div>
          </div>
          <nav class="navigation" id="navigation" aria-label="固定メニュー"></nav>
        </aside>

        <main class="workspace" tabindex="0">
          <h1>スクロール検証用ダミーコンテンツ</h1>
          <ol class="dummy-list" id="dummy-list" aria-label="連番"></ol>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
