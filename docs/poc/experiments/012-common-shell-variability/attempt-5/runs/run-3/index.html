<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" id="shell" data-drawer="open" data-theme="light">
      <header class="app-header">
        <button class="icon-button" id="drawer-toggle" type="button" aria-controls="drawer" aria-expanded="true" aria-label="Drawer を閉じる" title="Drawer を閉じる">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="workspace-name">業務ワークスペース</span>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="ダークテーマに切り替える" title="ダークテーマに切り替える">
          <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.6 15.8A8.8 8.8 0 0 1 8.2 3.4 8.8 8.8 0 1 0 20.6 15.8Z"/></svg>
        </button>
      </header>

      <div class="main-layout">
        <aside class="drawer" id="drawer" aria-label="ナビゲーション">
          <div class="drawer-search">
            <label for="menu-search">メニューを検索</label>
            <div class="search-control">
              <input id="menu-search" type="search" autocomplete="off" placeholder="項目を検索">
              <button id="clear-search" type="button" aria-label="検索をクリア" title="検索をクリア" hidden>×</button>
            </div>
          </div>
          <nav class="menu-scroll" aria-label="Drawer メニュー">
            <ul class="menu-list" id="menu-list"></ul>
            <p class="no-matches" id="no-matches" role="status" hidden>一致する項目はありません</p>
          </nav>
        </aside>

        <main class="workspace" tabindex="-1">
          <section class="workspace-content" aria-label="スクロール検証用ダミーコンテンツ">
            <h1>スクロール検証用ダミーコンテンツ</h1>
            <ol class="number-list" id="number-list" aria-label="連番"></ol>
          </section>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
