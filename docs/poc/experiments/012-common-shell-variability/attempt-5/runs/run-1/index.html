<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" data-theme="light" data-drawer="open">
    <header class="app-header">
      <button class="icon-button drawer-toggle" type="button" aria-label="Drawer を閉じる" aria-expanded="true" aria-controls="drawer">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <p class="workspace-name">業務ワークスペース</p>
      <button class="icon-button theme-toggle" type="button" aria-label="ダークテーマに切り替える" title="ダークテーマに切り替える">
        <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </header>

    <div class="shell-body">
      <aside class="drawer" id="drawer" aria-label="ナビゲーション">
        <div class="drawer-search">
          <label for="menu-search">メニューを検索</label>
          <div class="search-control">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
            <input id="menu-search" type="search" autocomplete="off" placeholder="メニューを検索">
            <button class="clear-search" type="button" aria-label="検索をクリア" hidden>×</button>
          </div>
        </div>
        <nav class="menu-scroll" aria-label="Drawer メニュー">
          <ul class="menu-list" id="menu-list"></ul>
          <p class="no-matches" id="no-matches" hidden>一致するメニューはありません</p>
        </nav>
      </aside>

      <main class="workspace" tabindex="-1">
        <h1>スクロール検証用ダミーコンテンツ</h1>
        <ol class="number-list" aria-label="ダミー連番"></ol>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
