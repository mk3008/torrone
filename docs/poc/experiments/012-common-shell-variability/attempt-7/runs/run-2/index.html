<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-theme="light">
      <header class="app-header">
        <div class="header-leading">
          <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14M12 9h5M12 12h5M12 15h5"/></svg>
          </button>
          <span class="workspace-name">業務ワークスペース</span>
        </div>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="ダークテーマに切り替え" title="ダークテーマに切り替え">
          <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5 8.5 8.5 0 1 0 20.5 14.1z"/></svg>
          <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>

      <div class="shell-body">
        <aside class="drawer" id="drawer" aria-label="ナビゲーション">
          <div class="drawer-search">
            <label for="menu-search">メニューを検索</label>
            <div class="search-field">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15.2 15.2 4 4"/></svg>
              <input id="menu-search" type="search" placeholder="項目を検索">
              <button class="clear-search" type="button" aria-label="検索をクリア" title="検索をクリア">×</button>
            </div>
          </div>
          <nav class="nav-list" aria-label="メニュー">
            <div class="nav-group" data-group="01">
              <button class="nav-row parent-row" type="button" aria-expanded="true">
                <span>グループ 01</span><span class="disclosure" aria-hidden="true">⌄</span>
              </button>
              <div class="children">
                <button class="nav-row child-row selected" type="button" aria-current="page"><span>項目 01-01</span></button>
                <button class="nav-row child-row" type="button"><span>項目 01-02</span></button>
              </div>
            </div>
            <div class="nav-leaves" id="nav-leaves"></div>
            <p class="no-matches" hidden>一致する項目はありません</p>
          </nav>
        </aside>

        <main class="workspace" tabindex="-1">
          <div class="workspace-content">
            <h1>スクロール検証用ダミーコンテンツ</h1>
            <ol id="dummy-list" aria-label="連番"></ol>
          </div>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
