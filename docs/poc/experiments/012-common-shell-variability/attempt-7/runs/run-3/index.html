<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-theme="light" data-drawer="open">
      <header class="app-header">
        <button class="icon-button drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16M13 9h5M13 13h5"/></svg>
        </button>
        <strong>業務ワークスペース</strong>
        <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
          <svg class="moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 15.4A8.5 8.5 0 0 1 8.6 4 8.5 8.5 0 1 0 20 15.4Z"/></svg>
          <svg class="sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>
      <div class="shell-body">
        <aside class="drawer" aria-label="Navigation">
          <div class="menu-search">
            <label for="menu-query">メニューを検索</label>
            <div class="search-field">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></svg>
              <input id="menu-query" type="search" placeholder="項目名を入力" autocomplete="off">
              <button class="clear-search" type="button" aria-label="検索をクリア" title="検索をクリア">×</button>
            </div>
          </div>
          <nav class="menu-list" aria-label="メニュー"></nav>
        </aside>
        <main class="workspace" tabindex="-1">
          <h1>スクロール検証用ダミーコンテンツ</h1>
          <ol class="number-list" aria-label="1 から 80 の連番"></ol>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
