<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell" data-theme="light" data-drawer="open">
    <header class="app-header">
      <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation"></button>
      <span class="workspace-name">業務ワークスペース</span>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme"></button>
    </header>
    <div class="shell-body">
      <aside class="drawer" aria-label="ナビゲーション">
        <div class="drawer-search">
          <label for="nav-search">メニューを検索</label>
          <div class="search-field">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="nav-search" type="search" autocomplete="off" placeholder="項目名を入力">
            <button class="clear-search" id="clear-search" type="button" aria-label="検索をクリア" title="検索をクリア"></button>
          </div>
        </div>
        <nav class="navigation" aria-label="固定ナビゲーション">
          <ul class="nav-list" id="nav-list"></ul>
          <p class="no-results" id="no-results" hidden>一致する項目はありません</p>
        </nav>
      </aside>
      <section class="workspace" aria-labelledby="workspace-title">
        <h1 id="workspace-title">スクロール検証用ダミーコンテンツ</h1>
        <ol class="number-grid" id="number-grid" aria-label="1から80までの連番"></ol>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
