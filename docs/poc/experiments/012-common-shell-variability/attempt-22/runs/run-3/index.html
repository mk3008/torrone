<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" data-drawer="open" data-theme="light">
    <header class="header">
      <button class="icon-button drawer-toggle" type="button" aria-label="Drawer を閉じる" title="Drawer を閉じる">
        <svg class="icon icon-close" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 3v18m7-12-3 3 3 3"/></svg>
        <svg class="icon icon-open" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 3v18m4-6 3-3-3-3"/></svg>
      </button>
      <p class="workspace-name">業務ワークスペース</p>
      <button class="icon-button theme-toggle" type="button" aria-label="ダークテーマに切り替える" title="ダークテーマに切り替える">
        <svg class="icon moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.8 15.7A9 9 0 0 1 8.3 3.2 9 9 0 1 0 20.8 15.7z"/></svg>
        <svg class="icon sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </header>
    <div class="shell-body">
      <aside class="drawer" aria-label="ナビゲーション">
        <div class="drawer-top">
          <label class="search-label" for="nav-search">メニューを検索</label>
          <div class="search-field">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
            <input id="nav-search" type="search" autocomplete="off" placeholder="項目を検索">
            <button class="clear-search" type="button" aria-label="検索をクリア" title="検索をクリア">
              <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </div>
        <nav class="nav-list" aria-label="固定ナビゲーション"></nav>
      </aside>
      <main class="workspace" tabindex="-1">
        <h1>スクロール検証用ダミーコンテンツ</h1>
        <ol class="number-list" aria-label="1 から 80 の連番"></ol>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
