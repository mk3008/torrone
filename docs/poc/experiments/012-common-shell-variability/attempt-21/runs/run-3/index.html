<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-theme="light" data-drawer="open">
      <header class="header">
        <button class="icon-button drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
          <svg class="panel-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="3" width="18" height="18" rx="1"></rect><path d="M9 3v18"></path><path class="direction" d="m15 8-4 4 4 4"></path>
          </svg>
        </button>
        <div class="workspace-name">業務ワークスペース</div>
        <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="theme-icon" d="M20 15.4A8 8 0 0 1 8.6 4 8 8 0 1 0 20 15.4Z"></path></svg>
        </button>
      </header>
      <div class="below-header">
        <aside class="drawer" aria-label="Navigation">
          <div class="drawer-search">
            <label for="nav-search">メニューを検索</label>
            <div class="search-control">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"></circle><path d="m15 15 5 5"></path></svg>
              <input id="nav-search" type="search" autocomplete="off" placeholder="項目名で絞り込む">
              <button class="clear-search" type="button" aria-label="検索をクリア" title="検索をクリア" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
              </button>
            </div>
          </div>
          <nav class="navigation-list" aria-label="固定メニュー">
            <ul class="nav-tree"></ul>
            <p class="no-matches" hidden>一致する項目はありません</p>
          </nav>
        </aside>
        <main class="workspace" tabindex="-1">
          <h1>スクロール検証用ダミーコンテンツ</h1>
          <ol class="number-list" aria-label="ダミー番号"></ol>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
