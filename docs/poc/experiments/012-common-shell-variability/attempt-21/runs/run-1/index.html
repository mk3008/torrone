<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" id="shell" data-theme="light" data-drawer="open">
    <header class="app-header" aria-label="業務ワークスペースのヘッダー">
      <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
        <svg id="drawer-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"></rect><path d="M9 4v16"></path><path id="drawer-chevron" d="m16 9-3 3 3 3"></path></svg>
      </button>
      <div class="workspace-name">業務ワークスペース</div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="ダークテーマに切り替え" title="ダークテーマに切り替え">
        <svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path id="theme-path" d="M20.4 14.6A8.3 8.3 0 0 1 9.4 3.6 8.3 8.3 0 1 0 20.4 14.6Z"></path></svg>
      </button>
    </header>

    <div class="shell-body">
      <aside class="drawer" id="drawer" aria-label="ナビゲーション">
        <div class="drawer-search">
          <label for="nav-search">メニューを検索</label>
          <div class="search-field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="5.8"></circle><path d="m15.2 15.2 4.2 4.2"></path></svg>
            <input id="nav-search" type="search" placeholder="項目名を検索">
            <button class="clear-search" id="clear-search" type="button" aria-label="検索をクリア" title="検索をクリア" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
            </button>
          </div>
        </div>
        <nav class="nav-list" id="nav-list" aria-label="メニュー"></nav>
      </aside>

      <main class="workspace" tabindex="-1">
        <h1>スクロール検証用ダミーコンテンツ</h1>
        <ol class="number-list" id="number-list" aria-label="ダミー連番"></ol>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
