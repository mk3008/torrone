<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務ワークスペース</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" data-theme="light" data-drawer="open">
    <header class="header">
      <button id="drawer-toggle" class="icon-control" type="button" aria-controls="drawer" aria-expanded="true" aria-label="Close navigation" title="Close navigation">
        <svg class="panel-left-close" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
        <svg class="panel-left-open" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m13 9 3 3-3 3"/></svg>
      </button>
      <span class="workspace-identity">業務ワークスペース</span>
      <button id="theme-toggle" class="icon-control" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8a8.5 8.5 0 1 0 11.3 11.3Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>
    <div class="app-body">
      <aside id="drawer" class="drawer" aria-label="ナビゲーション">
        <div class="search-section">
          <label for="drawer-search">メニューを検索</label>
          <div class="search-box" id="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15.1 15.1 4.4 4.4"/></svg>
            <input id="drawer-search" type="search" autocomplete="off" placeholder="項目を検索">
          </div>
        </div>
        <nav class="drawer-list" aria-label="メニュー">
          <section id="group-01">
            <button id="group-control" class="nav-row nav-parent" type="button" aria-expanded="true">
              <span>グループ 01</span>
              <svg class="chevron-down" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              <svg class="chevron-right" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </button>
            <div id="group-items">
              <button class="nav-row nav-child is-current" type="button" aria-current="page">項目 01-01</button>
              <button class="nav-row nav-child" type="button">項目 01-02</button>
            </div>
          </section>
          <div id="leaf-items"></div>
          <p id="no-results" hidden>一致する項目はありません</p>
        </nav>
      </aside>
      <main class="workspace">
        <h1>スクロール検証用ダミーコンテンツ</h1>
        <ol id="numbers" aria-label="スクロール検証用ダミーコンテンツ"></ol>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
