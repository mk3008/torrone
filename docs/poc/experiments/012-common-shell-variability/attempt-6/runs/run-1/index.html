<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-theme="light">
      <header class="app-header">
        <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
          <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M4 4h16v16H4zM9 4v16"/></svg>
        </button>
        <p class="workspace-name">業務ワークスペース</p>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M20.2 15.3A8.6 8.6 0 0 1 8.7 3.8 8.6 8.6 0 1 0 20.2 15.3Z"/></svg>
          <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
        </button>
      </header>

      <div class="shell-body">
        <aside class="drawer" aria-label="Navigation">
          <div class="drawer-search">
            <label for="menu-search">メニューを検索</label>
            <div class="search-field">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15.2 15.2 4.3 4.3"/></svg>
              <input id="menu-search" type="search" placeholder="項目名を検索">
              <button id="clear-search" class="clear-search" type="button" aria-label="検索をクリア" title="検索をクリア" hidden>×</button>
            </div>
          </div>
          <nav class="navigation-list" aria-label="Drawer navigation"></nav>
        </aside>

        <main class="workspace">
          <h1>スクロール検証用ダミーコンテンツ</h1>
          <ol class="number-list" aria-label="スクロール検証用の連番"></ol>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
