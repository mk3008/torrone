<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" data-theme="light">
      <header class="app-header">
        <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"></rect><path d="M9 4v16M12 8h5M12 12h5M12 16h5"></path></svg>
        </button>
        <h1>業務ワークスペース</h1>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 15.3A8.7 8.7 0 0 1 8.7 4 8.7 8.7 0 1 0 20 15.3Z"></path></svg>
          <svg class="sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </button>
      </header>
      <div class="shell-body">
        <aside class="drawer" aria-label="Navigation">
          <div class="drawer-search">
            <label for="menu-search">メニューを検索</label>
            <div class="search-field">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"></circle><path d="m15 15 5 5"></path></svg>
              <input id="menu-search" type="search" placeholder="項目を検索" autocomplete="off">
              <button id="clear-search" class="clear-button" type="button" aria-label="Clear menu search" title="Clear menu search">×</button>
            </div>
          </div>
          <nav class="nav-scroll" aria-label="Workspace navigation"><ul id="nav-list"></ul></nav>
        </aside>
        <main class="workspace" tabindex="-1">
          <section aria-labelledby="workspace-title">
            <h2 id="workspace-title">スクロール検証用ダミーコンテンツ</h2>
            <ol class="number-list" id="number-list" aria-label="連番"></ol>
          </section>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
