<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell" id="shell" data-theme="light">
      <header class="app-header">
        <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5.5h16v13H4zM8 5.5v13M11 9h6M11 12h6M11 15h4"/></svg>
        </button>
        <p class="workspace-name">業務ワークスペース</p>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 15.2A8 8 0 0 1 8.8 4 8 8 0 1 0 20 15.2z"/></svg>
          <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2.2M12 19.8V22M22 12h-2.2M4.2 12H2M19.1 4.9l-1.55 1.55M6.45 17.55 4.9 19.1M19.1 19.1l-1.55-1.55M6.45 6.45 4.9 4.9"/></svg>
        </button>
      </header>

      <div class="shell-body">
        <aside class="drawer" id="drawer" aria-label="Navigation">
          <div class="drawer-search">
            <label for="menu-search">メニューを検索</label>
            <div class="search-field">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4.5 4.5"/></svg>
              <input id="menu-search" type="search" placeholder="項目名を検索" autocomplete="off">
              <button class="clear-search" id="clear-search" type="button" aria-label="検索をクリア" title="検索をクリア">×</button>
            </div>
          </div>
          <nav class="nav-list" aria-label="固定メニュー" id="nav-list"></nav>
        </aside>

        <main class="workspace" aria-label="ワークスペース">
          <div class="workspace-content">
            <h1>スクロール検証用ダミーコンテンツ</h1>
            <ol id="scroll-items"></ol>
          </div>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
