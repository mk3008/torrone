<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><!-- PAGE_TITLE --></title>
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <div class="shell" id="shell">
    <header class="header">
      <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation"></button>
      <div class="workspace-name">業務ワークスペース</div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme"></button>
    </header>
    <div class="shell-body">
      <aside class="drawer" id="drawer" aria-label="Navigation">
        <div class="drawer-search">
          <label for="menu-search">メニューを検索</label>
          <div class="search-field">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="menu-search" type="search" placeholder="固定項目を検索" autocomplete="off">
            <button class="clear-button" id="search-clear" type="button" aria-label="検索をクリア" title="検索をクリア"></button>
          </div>
        </div>
        <nav class="navigation" id="navigation" aria-label="固定メニュー"></nav>
      </aside>
      <main class="workspace" aria-label="ワークスペース">
        <section class="customer-create" aria-labelledby="page-title">
          <header class="page-header"><h1 id="page-title">顧客追加</h1><p>新しい顧客情報を登録します。</p></header>
          <form id="create-form" novalidate>
            <div class="error-summary" id="error-summary" role="alert" tabindex="-1" hidden>
              <strong>入力内容を確認してください。</strong><ul id="error-list"></ul>
            </div>
            <fieldset class="customer-fields">
              <legend>顧客情報</legend>
              <div class="field"><label for="name">氏名 <span class="required">必須</span></label><input id="name" name="name" type="text" autocomplete="name" aria-describedby="name-feedback"><p class="feedback" id="name-feedback" aria-live="polite"></p></div>
              <div class="field"><label for="birthdate">生年月日 <span class="required">必須</span></label><input id="birthdate" name="birthdate" type="text" inputmode="numeric" autocomplete="bday" placeholder="YYYY-MM-DD" aria-describedby="birthdate-feedback"><p class="feedback helper" id="birthdate-feedback" aria-live="polite">生年月日はYYYY-MM-DD形式で入力してください。</p></div>
              <div class="field"><label for="address">住所 <span class="required">必須</span></label><input id="address" name="address" type="text" autocomplete="street-address" aria-describedby="address-feedback"><p class="feedback" id="address-feedback" aria-live="polite"></p></div>
              <div class="field"><label for="phone">電話番号 <span class="required">必須</span></label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="000-0000-0000" aria-describedby="phone-feedback"><p class="feedback helper" id="phone-feedback" aria-live="polite">電話番号は数字とハイフンで入力してください。</p></div>
              <div class="field"><label for="email">メールアドレス <span class="required">必須</span></label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.test" aria-describedby="email-feedback"><p class="feedback helper" id="email-feedback" aria-live="polite">メールアドレスはname@example.test形式で入力してください。</p></div>
              <div class="field"><label for="notes">備考 <span class="optional">任意</span></label><textarea id="notes" name="notes" rows="4" aria-describedby="notes-feedback"></textarea><p class="feedback" id="notes-feedback" aria-live="polite"></p></div>
            </fieldset>
            <div class="form-actions"><button class="save-action" type="submit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path><path d="M17 21v-8H7v8M7 3v5h8"></path></svg>保存</button></div>
          </form>
        </section>
        <div class="numbers" id="numbers" hidden style="display: none"></div>
      </main>
    </div>
  </div>
  <script src="shell.js"></script>
  <script src="page.js"></script>
</body>
</html>
