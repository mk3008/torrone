<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>顧客追加</title><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="page.css"></head><body><div class="shell" id="shell"><header class="header"><button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation"></button><div class="workspace-name">業務ワークスペース</div><button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme"></button></header><div class="shell-body"><aside class="drawer" id="drawer" aria-label="Navigation"><div class="drawer-search"><label for="menu-search">メニューを検索</label><div class="search-field"><span class="search-icon" aria-hidden="true"></span><input id="menu-search" type="search" placeholder="固定項目を検索" autocomplete="off"><button class="clear-button" id="search-clear" type="button" aria-label="検索をクリア" title="検索をクリア"></button></div></div><nav class="navigation" id="navigation" aria-label="固定メニュー"></nav></aside><main class="workspace" aria-label="ワークスペース"><div class="page"><header class="page-header"><h1>顧客追加</h1><p>新しい顧客情報を登録します。</p></header><form id="customer-form" novalidate><div class="error-summary" id="error-summary" tabindex="-1" hidden><strong>入力内容を確認してください。</strong><ul id="error-list"></ul></div><fieldset><legend>顧客情報</legend><div class="fields">
<label for="name">氏名 <em>必須</em></label><input id="name" name="name" type="text" aria-describedby="name-message" required><p id="name-message" class="message" aria-live="polite">&nbsp;</p>
<label for="birthdate">生年月日 <em>必須</em></label><input id="birthdate" name="birthdate" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" aria-describedby="birthdate-message" required><p id="birthdate-message" class="message">生年月日はYYYY-MM-DD形式で入力してください。</p>
<label for="address">住所 <em>必須</em></label><input id="address" name="address" type="text" aria-describedby="address-message" required><p id="address-message" class="message">&nbsp;</p>
<label for="phone">電話番号 <em>必須</em></label><input id="phone" name="phone" type="tel" inputmode="tel" placeholder="000-0000-0000" aria-describedby="phone-message" required><p id="phone-message" class="message">電話番号は数字とハイフンを使用して入力してください。</p>
<label for="email">メールアドレス <em>必須</em></label><input id="email" name="email" type="email" placeholder="name@example.com" aria-describedby="email-message" required><p id="email-message" class="message">メールアドレスはname@example.com形式で入力してください。</p>
<label for="notes">備考 <i>任意</i></label><textarea id="notes" name="notes" aria-describedby="notes-message"></textarea><p id="notes-message" class="message">&nbsp;</p>
</div></fieldset><div class="form-actions"><button class="save" type="submit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h12l2 2v16H5z"></path><path d="M8 3v6h8V3M8 21v-7h8v7"></path></svg>保存</button></div></form></div><div class="numbers" id="numbers" hidden style="display: none"></div></main></div></div><script src="shell.js"></script><script src="page.js"></script></body></html>
