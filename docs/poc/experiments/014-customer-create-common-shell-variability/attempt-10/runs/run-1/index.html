<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="shell.css">
    <link rel="stylesheet" href="page.css">
  </head>
  <body>
    <div class="shared-shell" data-theme="light" data-drawer="open">
      <header class="shell-header">
        <button class="shell-icon-button" type="button" data-drawer-toggle aria-controls="workspace-drawer" aria-expanded="true" aria-label="Drawer を閉じる">
          <span aria-hidden="true">☰</span>
        </button>
        <p class="shell-workspace-name">業務ワークスペース</p>
        <button class="shell-icon-button shell-theme-button" type="button" data-theme-toggle aria-label="ダークモードに切り替える">
          <span data-theme-icon aria-hidden="true">◐</span>
        </button>
      </header>

      <div class="shell-body">
        <aside class="shell-drawer" id="workspace-drawer" aria-label="業務ワークスペースのナビゲーション">
          <nav>
            <ul class="shell-drawer-list">
              <li><a href="#section-a">セクション A</a></li>
              <li class="shell-drawer-parent">
                <a href="#section-b">セクション B</a>
                <span class="shell-disclosure" aria-label="展開中">⌄</span>
                <ul class="shell-drawer-children">
                  <li><a class="current" href="#item-b-1" aria-current="page">項目 B-1</a></li>
                  <li><a href="#item-b-2">項目 B-2</a></li>
                </ul>
              </li>
              <li><a href="#section-c">セクション C</a></li>
            </ul>
          </nav>
        </aside>
        <main class="shell-workspace" aria-label="ワークスペース">
          <article class="create-page" aria-labelledby="page-title">
            <header class="create-page-header">
              <p class="create-page-eyebrow">顧客</p>
              <h1 id="page-title">顧客追加</h1>
              <p class="create-page-description">新しい顧客情報を登録します。</p>
            </header>

            <form class="create-form" id="customer-create-form" novalidate>
              <div class="form-error-summary" id="form-error-summary" role="alert" tabindex="-1" hidden>
                <p>入力内容を確認してください。</p>
                <ul id="form-error-list"></ul>
              </div>

              <section class="field-group" aria-labelledby="customer-fields-title">
                <h2 id="customer-fields-title">顧客情報</h2>
                <div class="field-flow">
                  <div class="form-field">
                    <label for="customer-name">氏名 <span class="field-required">必須</span></label>
                    <input id="customer-name" name="customer-name" type="text" required autocomplete="name" aria-describedby="customer-name-message">
                    <p class="field-message" id="customer-name-message" aria-live="polite" data-helper=""></p>
                  </div>

                  <div class="form-field">
                    <label for="birth-date">生年月日 <span class="field-required">必須</span></label>
                    <input id="birth-date" name="birth-date" type="text" required inputmode="numeric" autocomplete="bday" placeholder="YYYY-MM-DD" aria-describedby="birth-date-message">
                    <p class="field-message" id="birth-date-message" aria-live="polite" data-helper="生年月日は YYYY-MM-DD 形式で入力してください。">生年月日は YYYY-MM-DD 形式で入力してください。</p>
                  </div>

                  <div class="form-field">
                    <label for="address">住所 <span class="field-required">必須</span></label>
                    <input id="address" name="address" type="text" required autocomplete="street-address" aria-describedby="address-message">
                    <p class="field-message" id="address-message" aria-live="polite" data-helper=""></p>
                  </div>

                  <div class="form-field">
                    <label for="telephone">電話番号 <span class="field-required">必須</span></label>
                    <input id="telephone" name="telephone" type="tel" required inputmode="tel" autocomplete="tel" placeholder="03-1234-5678" aria-describedby="telephone-message">
                    <p class="field-message" id="telephone-message" aria-live="polite" data-helper="電話番号は数字とハイフンを使用して入力してください。">電話番号は数字とハイフンを使用して入力してください。</p>
                  </div>

                  <div class="form-field">
                    <label for="email">メールアドレス <span class="field-required">必須</span></label>
                    <input id="email" name="email" type="email" required autocomplete="email" placeholder="name@example.com" aria-describedby="email-message">
                    <p class="field-message" id="email-message" aria-live="polite" data-helper="メールアドレスは name@example.com 形式で入力してください。">メールアドレスは name@example.com 形式で入力してください。</p>
                  </div>

                  <div class="form-field">
                    <label for="notes">備考 <span class="field-optional">任意</span></label>
                    <textarea id="notes" name="notes" rows="4" aria-describedby="notes-message"></textarea>
                    <p class="field-message" id="notes-message" aria-live="polite" data-helper=""></p>
                  </div>
                </div>
              </section>

              <div class="form-action-toolbar" aria-label="顧客追加の操作">
                <div class="form-action-group">
                  <button class="button button-primary" type="submit">保存</button>
                  <button class="button button-secondary" type="button">キャンセル</button>
                </div>
              </div>
            </form>
          </article>
        </main>
      </div>
    </div>
    <script src="shell.js"></script>
    <script src="page.js"></script>
  </body>
</html>
