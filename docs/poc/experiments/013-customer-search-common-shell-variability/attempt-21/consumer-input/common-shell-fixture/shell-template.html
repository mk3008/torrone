<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>業務ワークスペース</title>
    <link rel="stylesheet" href="shell.css">
    <link rel="stylesheet" href="page.css">
  </head>
  <body>
    <div class="shared-shell" data-theme="light" data-drawer="open">
      <header class="shell-header">
        <button class="shell-icon-button" type="button" data-drawer-toggle aria-controls="workspace-drawer" aria-expanded="true" aria-label="Drawer を閉じる">
          <span aria-hidden="true">☰</span>
        </button>
        <p class="shell-workspace-name">業務ワークスペース</p>
        <button class="shell-icon-button shell-theme-button" type="button" data-theme-toggle aria-label="ダークモードに切り替える">
          <span data-theme-icon aria-hidden="true">◐</span>
        </button>
      </header>

      <div class="shell-body">
        <aside class="shell-drawer" id="workspace-drawer" aria-label="業務ワークスペースのナビゲーション">
          <nav>
            <ul class="shell-drawer-list">
              <li><a href="#section-a">セクション A</a></li>
              <li class="shell-drawer-parent">
                <a href="#section-b">セクション B</a>
                <span class="shell-disclosure" aria-label="展開中">⌄</span>
                <ul class="shell-drawer-children">
                  <li><a class="current" href="#item-b-1" aria-current="page">項目 B-1</a></li>
                  <li><a href="#item-b-2">項目 B-2</a></li>
                </ul>
              </li>
              <li><a href="#section-c">セクション C</a></li>
            </ul>
          </nav>
        </aside>
        <main class="shell-workspace" aria-label="ワークスペース"><!-- PAGE_SLOT --></main>
      </div>
    </div>
    <script src="shell.js"></script>
    <script src="page.js"></script>
  </body>
</html>
