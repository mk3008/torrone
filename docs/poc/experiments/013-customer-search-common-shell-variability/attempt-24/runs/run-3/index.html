<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><!-- PAGE_TITLE --></title>
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <div class="shell" id="shell">
    <header class="header">
      <button class="icon-button" id="drawer-toggle" type="button" aria-label="Close navigation" title="Close navigation"></button>
      <div class="workspace-name">業務ワークスペース</div>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme"></button>
    </header>
    <div class="shell-body">
      <aside class="drawer" id="drawer" aria-label="Navigation">
        <div class="drawer-search">
          <label for="menu-search">メニューを検索</label>
          <div class="search-field">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="menu-search" type="search" placeholder="固定項目を検索" autocomplete="off">
            <button class="clear-button" id="search-clear" type="button" aria-label="検索をクリア" title="検索をクリア"></button>
          </div>
        </div>
        <nav class="navigation" id="navigation" aria-label="固定メニュー"></nav>
      </aside>
      <main class="workspace" aria-label="ワークスペース">
        <section class="customer-search" aria-labelledby="page-title">
          <header class="page-header">
            <h1 id="page-title">顧客検索</h1>
            <p>登録済みの顧客情報を検索・確認します。</p>
          </header>

          <form class="conditions-pane" id="customer-search-form">
            <fieldset>
              <legend>検索条件</legend>
              <div class="condition-grid">
                <label>氏名<input name="name" type="search" autocomplete="off"></label>
                <label>生年月日<input name="birthdate" type="date"></label>
                <label>電話番号<input name="phone" type="tel" autocomplete="off"></label>
                <label>メールアドレス<input name="email" type="email" autocomplete="off"></label>
              </div>
            </fieldset>
            <div class="condition-actions">
              <button class="primary-action" type="submit">検索</button>
              <button class="secondary-action" type="reset">リセット</button>
            </div>
          </form>

          <section class="results-pane" aria-labelledby="results-title">
            <div class="results-header">
              <h2 id="results-title">検索結果 <span id="result-count">6件</span></h2>
              <button class="secondary-action add-customer" type="button">顧客を追加</button>
            </div>
            <div class="grid-scroll" id="grid-scroll" tabindex="0" aria-label="顧客検索結果グリッド。横方向にスクロールできます。">
              <table>
                <thead><tr><th scope="col" class="sticky-id">顧客ID</th><th scope="col">氏名</th><th scope="col">生年月日</th><th scope="col">住所</th><th scope="col">電話番号</th><th scope="col">メールアドレス</th><th scope="col">備考</th></tr></thead>
                <tbody id="customer-rows"></tbody>
              </table>
            </div>
            <footer class="pagination" aria-label="ページネーション">
              <button type="button" disabled>前へ</button><span aria-current="page">1</span><button type="button">次へ</button>
            </footer>
          </section>
        </section>
        <div class="numbers" id="numbers" hidden></div>
      </main>
    </div>
  </div>
  <script src="shell.js"></script>
  <script src="page.js"></script>
</body>
</html>
