<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Single date picker human-calibration baseline</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif; --canvas: #f3f6fa; --surface: #fff; --text: #101d2f; --muted: #54657a; --border: #c6d2df; --accent: #1d73b7; --focus: #86b9ee; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { min-width: 720px; color: var(--text); background: var(--canvas); font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    :is(button, input):focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .reference-note { padding: 10px 24px; color: #405267; background: #f8fbfe; border-bottom: 1px dashed #9cafc1; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .sample { width: min(620px, calc(100% - 48px)); margin: 48px auto; padding: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgb(37 55 75 / 8%); }
    .sample h2 { margin: 0 0 6px; font-size: 22px; }
    .support { margin: 0 0 20px; color: var(--muted); }
    .field-label { display: block; margin-bottom: 6px; color: #394b60; font-size: 14px; font-weight: 650; }
    .date-field { display: flex; align-items: stretch; gap: 8px; }
    .date-value { flex: 1; min-height: 42px; padding: 8px 11px; color: var(--text); background: var(--surface); border: 1px solid #94a8bd; border-radius: 6px; }
    .trigger, .secondary { min-height: 42px; padding: 0 14px; color: #183653; background: var(--surface); border: 1px solid #8ea2b9; border-radius: 6px; }
    .picker { width: 330px; margin-top: 10px; padding: 16px; background: var(--surface); border: 1px solid #98aabc; border-radius: 8px; box-shadow: 0 12px 28px rgb(27 45 65 / 16%); }
    .month-heading { margin: 0 0 12px; font-size: 16px; }
    .week { display: grid; grid-template-columns: repeat(7, 36px); gap: 6px; }
    .day { width: 36px; height: 36px; padding: 0; color: var(--text); background: var(--surface); border: 1px solid transparent; border-radius: 6px; }
    .day:hover { background: #edf3f9; }
    .day[aria-current="date"] { font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .day[aria-pressed="true"] { color: #fff; background: var(--accent); border-color: #155b92; font-weight: 700; }
    .selection-row { display: flex; min-height: 44px; margin-top: 18px; align-items: center; justify-content: space-between; gap: 16px; }
    .selection { margin: 0; color: #31465d; }
  </style>
</head>
<body>
  <div class="reference-note" data-reference-harness="reference-label">AI draft · single date · fixed review fixture: Sep 14 is today</div>
  <section class="sample" aria-labelledby="single-date-heading">
    <h2 id="single-date-heading">Required delivery date</h2>
    <p class="support">Choose the date by which the order must arrive.</p>
    <span class="field-label" id="date-label">Delivery date</span>
    <div class="date-field">
      <input class="date-value" aria-labelledby="date-label" value="Not selected" readonly>
      <button class="trigger" type="button" data-ref="date-trigger" aria-controls="date-picker-popup" aria-expanded="false">Choose date</button>
    </div>
    <div class="picker" id="date-picker-popup" role="dialog" aria-label="Choose delivery date" hidden>
      <h3 class="month-heading">September 2026</h3>
      <div class="week" aria-label="Dates in September 2026">
        <button class="day" type="button" aria-current="date" aria-label="September 14, 2026, today">14</button>
        <button class="day" type="button" data-ref="date-day" aria-label="September 15, 2026">15</button>
        <button class="day" type="button" data-ref="date-next-day" aria-label="September 16, 2026">16</button>
        <button class="day" type="button" aria-label="September 17, 2026">17</button>
        <button class="day" type="button" aria-label="September 18, 2026">18</button>
        <button class="day" type="button" aria-label="September 19, 2026">19</button>
        <button class="day" type="button" aria-label="September 20, 2026">20</button>
      </div>
    </div>
    <div class="selection-row">
      <p class="selection" data-ref="date-selection" aria-live="polite">No date selected.</p>
      <button class="secondary" type="button" data-ref="date-clear" hidden>Clear</button>
    </div>
  </section>

  <script type="application/json" data-reference-scenarios>
    {"version":1,"scenarios":[
      {"name":"toggle date picker","steps":[{"action":"click","target":"date-trigger"},{"action":"click","target":"date-trigger"}]},
      {"name":"pointer date selection","steps":[{"action":"click","target":"date-trigger"},{"action":"click","target":"date-day"}]},
      {"name":"keyboard date selection","steps":[{"action":"press","target":"date-trigger","key":" "},{"action":"press","target":"date-day","key":"ArrowRight"},{"action":"press","target":"date-next-day","key":"Enter"}]},
      {"name":"clear and reopen","steps":[{"action":"click","target":"date-trigger"},{"action":"click","target":"date-day"},{"action":"click","target":"date-clear"},{"action":"click","target":"date-trigger"}]}
    ]}
  </script>
  <script>
    (() => {
      const trigger = document.querySelector('[data-ref="date-trigger"]');
      const popup = document.getElementById('date-picker-popup');
      const days = [...popup.querySelectorAll('.day')];
      const selection = document.querySelector('[data-ref="date-selection"]');
      const clear = document.querySelector('[data-ref="date-clear"]');
      const value = document.querySelector('.date-value');
      const open = () => { popup.hidden = false; trigger.setAttribute('aria-expanded', 'true'); requestAnimationFrame(() => document.querySelector('[data-ref="date-day"]').focus()); };
      const close = () => { popup.hidden = true; trigger.setAttribute('aria-expanded', 'false'); trigger.focus(); };
      const choose = (day) => { days.forEach((item) => item.removeAttribute('aria-pressed')); day.setAttribute('aria-pressed', 'true'); value.value = `Sep ${day.textContent}, 2026`; selection.textContent = `Selected: September ${day.textContent}, 2026.`; clear.hidden = false; close(); };
      trigger.addEventListener('click', () => { if (popup.hidden) open(); else close(); });
      days.forEach((day, index) => {
        day.addEventListener('click', () => choose(day));
        day.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowRight') { event.preventDefault(); days[Math.min(index + 1, days.length - 1)].focus(); }
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); choose(day); }
          if (event.key === 'Escape') { event.preventDefault(); close(); }
        });
      });
      clear.addEventListener('click', () => { days.forEach((day) => day.removeAttribute('aria-pressed')); value.value = 'Not selected'; selection.textContent = 'No date selected.'; clear.hidden = true; trigger.focus(); });
    })();
  </script>
</body>
</html>
