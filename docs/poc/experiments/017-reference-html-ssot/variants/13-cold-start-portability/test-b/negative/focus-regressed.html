  <script>
    (() => {
      class MaintenanceWindowPicker {
        static TODAY = '2026-08-14';
        static MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        constructor(root) {
          this.root = root;
          this.nodes = {
            input: root.querySelector('[data-ref="range-input"]'), clear: root.querySelector('[data-ref="range-clear"]'), trigger: root.querySelector('[data-ref="range-trigger"]'),
            flyout: root.querySelector('[data-ref="range-picker"]'), startTab: root.querySelector('[data-ref="range-start-mode"]'), endTab: root.querySelector('[data-ref="range-end-mode"]'),
            startText: root.querySelector('[data-window-start]'), endText: root.querySelector('[data-window-end]'), period: root.querySelector('[data-ref="range-month"]'),
            instruction: root.querySelector('[data-ref="range-status"]'), dates: root.querySelector('[data-window-dates]'), confirm: root.querySelector('[data-ref="range-apply"]'),
            problem: root.querySelector('[data-ref="range-message"]')
          };
          this.state = { year: 2026, month: 7, start: '', end: '', draftStart: '', draftEnd: '', active: 'start', opener: this.nodes.input };
          this.suppressOpen = false;
          this.connect();
          this.draw();
        }
        dateId(year, month, day) { return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; }
        parse(raw) {
          if (!raw.trim()) return '';
          const found = raw.trim().match(/^(\d{4})(?:-?)(\d{2})(?:-?)(\d{2})$/);
          if (!found) return null;
          const year = Number(found[1]); const month = Number(found[2]); const day = Number(found[3]);
          const probe = new Date(Date.UTC(year, month - 1, day));
          return probe.getUTCFullYear() === year && probe.getUTCMonth() === month - 1 && probe.getUTCDate() === day ? this.dateId(year, month - 1, day) : null;

          this.nodes.startTab.setAttribute('aria-pressed', String(name === 'start'));
          this.nodes.endTab.setAttribute('aria-pressed', String(name === 'end'));
          this.nodes.instruction.textContent = name === 'start' ? 'Choose a start date, or leave it open.' : 'Choose an end date, or leave it open.';
        }
        updateSummaries() {
          this.nodes.startText.textContent = this.state.draftStart || 'Open';
          this.nodes.endText.textContent = this.state.draftEnd || 'Open';
          this.nodes.confirm.disabled = !(this.state.draftStart || this.state.draftEnd);
        }
        draw() {
          const { year, month, draftStart, draftEnd } = this.state;
          this.nodes.period.textContent = `${MaintenanceWindowPicker.MONTHS[month]} ${year}`;
          this.nodes.dates.setAttribute('aria-label', `Dates in ${MaintenanceWindowPicker.MONTHS[month]} ${year}`);
          this.nodes.dates.replaceChildren();
          const first = new Date(Date.UTC(year, month, 1));
          const firstCell = new Date(first);
          firstCell.setUTCDate(1 - first.getUTCDay());
          for (let position = 0; position < 42; position += 1) {
            const date = new Date(firstCell);
            date.setUTCDate(firstCell.getUTCDate() + position);
            const value = this.dateId(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate());
            const cell = document.createElement('button');
            cell.type = 'button'; cell.className = 'calendar-number'; cell.textContent = String(date.getUTCDate()); cell.dataset.windowDate = value;

            if (identities[value]) cell.dataset.ref = identities[value];
            if (value === draftStart || value === draftEnd) cell.setAttribute('aria-pressed', 'true');
            if (draftStart && draftEnd && value > draftStart && value < draftEnd) cell.classList.add('inside-span');
            if (value > MaintenanceWindowPicker.TODAY) cell.disabled = true;
            this.nodes.dates.append(cell);
          }
          this.updateSummaries();
        }
        show(source, moveFocus) {
          this.state.opener = source; this.state.draftStart = this.state.start; this.state.draftEnd = this.state.end;
          this.chooseBoundary('start'); this.nodes.flyout.hidden = false; this.nodes.trigger.setAttribute('aria-expanded', 'true'); this.nodes.trigger.setAttribute('aria-label', 'Close calendar'); this.draw();

        }
        hide(restore = false) {

        }
        saveTyped() {
          const raw = this.nodes.input.value.trim();
          if (!raw) { this.state.start = ''; this.state.end = ''; this.nodes.clear.hidden = true; this.recover(); this.hide(); return true; }

          if (parts.length !== 2) { this.fail('Use start / end, leaving either side blank if unknown.'); return false; }
          const start = this.parse(parts[0]); const end = this.parse(parts[1]);
          if (start === null || end === null) { this.fail('Enter real dates as yyyy-mm-dd.'); return false; }
          if (!start && !end) { this.fail('Enter at least one boundary.'); return false; }
          if ((start && start > MaintenanceWindowPicker.TODAY) || (end && end > MaintenanceWindowPicker.TODAY)) { this.fail('Future dates are unavailable.'); return false; }
          if (start && end && start > end) { this.fail('The start date must not be after the end date.'); return false; }
          this.save(start, end); return true;
        }
        pick(value) {
          if (this.state.active === 'start') {
            this.state.draftStart = value;
            if (this.state.draftEnd && this.state.draftEnd < value) this.state.draftEnd = '';
            this.chooseBoundary('end'); this.nodes.instruction.textContent = 'Start set. Choose an end date, or Apply dates with an open end.';
          } else {
            if (this.state.draftStart && value < this.state.draftStart) { this.nodes.instruction.textContent = 'End date must be on or after the start date.'; return; }
            this.state.draftEnd = value;
            this.nodes.instruction.textContent = this.state.draftStart ? 'Range ready. Apply dates to finish.' : 'End set. Apply dates with an open start.';
          }
          this.draw();
        }
        shiftMonth(delta) { this.state.month += delta; if (this.state.month < 0) { this.state.month = 11; this.state.year -= 1; } if (this.state.month > 11) { this.state.month = 0; this.state.year += 1; } this.draw(); }
        connect() {
          const n = this.nodes;
          n.input.addEventListener('focus', () => { if (n.flyout.hidden && !this.suppressOpen) this.show(n.input, false); });
          n.input.addEventListener('input', () => { this.recover(); n.clear.hidden = !n.input.value; });
          n.input.addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); this.saveTyped(); } if (event.key === 'Escape' && !n.flyout.hidden) { event.preventDefault(); this.hide(true); } if (event.key === 'Tab') { this.saveTyped(); this.hide(false); } });
          n.trigger.addEventListener('click', () => { if (n.flyout.hidden) this.show(n.trigger, true); else this.hide(true); });
          n.clear.addEventListener('click', () => { Object.assign(this.state, { start: '', end: '', draftStart: '', draftEnd: '' }); n.input.value = ''; n.clear.hidden = true; this.recover(); this.draw(); this.hide(); this.suppressOpen = true; n.input.focus(); this.suppressOpen = false; });
          n.startTab.addEventListener('click', () => { this.chooseBoundary('start'); this.draw(); });
          n.endTab.addEventListener('click', () => { this.chooseBoundary('end'); this.draw(); });
          n.confirm.addEventListener('click', () => this.save(this.state.draftStart, this.state.draftEnd));
          n.dates.addEventListener('click', (event) => { const cell = event.target.closest('.calendar-number'); if (cell && !cell.disabled) this.pick(cell.dataset.windowDate); });
          n.dates.addEventListener('keydown', (event) => {
            const cell = event.target.closest('.calendar-number'); if (!cell) return;
            if (event.key === 'Escape') { event.preventDefault(); this.hide(true); return; }
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); if (!cell.disabled) this.pick(cell.dataset.windowDate); return; }
            const delta = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[event.key]; if (!delta) return;
            event.preventDefault(); const cells = [...n.dates.querySelectorAll('.calendar-number')]; let index = cells.indexOf(cell) + delta; while (cells[index]?.disabled) index += delta; cells[index]?.focus();
          });
          this.root.querySelector('[data-ref="range-prev-month"]').addEventListener('click', () => this.shiftMonth(-1));
          this.root.querySelector('[data-ref="range-next-month"]').addEventListener('click', () => this.shiftMonth(1));
          this.root.querySelector('[data-ref="range-prev-year"]').addEventListener('click', () => { this.state.year -= 1; this.draw(); });
          this.root.querySelector('[data-ref="range-next-year"]').addEventListener('click', () => { this.state.year += 1; this.draw(); });
          this.root.querySelector('[data-ref="range-today-action"]').addEventListener('click', () => { this.state.year = 2026; this.state.month = 7; this.draw(); requestAnimationFrame(() => n.dates.querySelector('[data-ref="range-today"]')?.focus()); });
          document.addEventListener('focusin', (event) => { if (!n.flyout.hidden && !this.root.contains(event.target)) this.hide(false); });
        }
      }
      new MaintenanceWindowPicker(document.querySelector('[data-window-widget]'));
    })();
  </script>
