<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="purpose" content="product fixture candidate observation only" />
    <title>Fixture candidate preview</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../../015-reference-first-common-shell/styles.css" />
  </head>
  <body>
    <div class="shell" data-theme="light">
      <header class="app-header">
        <button class="icon-button drawer-control" type="button" aria-label="Hide navigation" title="Hide navigation"></button>
        <p class="workspace-name"></p>
        <button class="icon-button theme-control" type="button" aria-label="Switch to dark palette" title="Switch to dark palette"></button>
      </header>
      <div class="shell-body">
        <aside class="drawer" aria-label="Application navigation">
          <div class="drawer-search">
            <label for="navigation-search"></label>
            <div class="input-wrap">
              <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" /><path d="m16 16 4 4" /></svg>
              <input id="navigation-search" type="search" autocomplete="off" />
            </div>
          </div>
          <nav class="navigation-list" aria-label="Candidate navigation"></nav>
        </aside>
        <main class="workspace" tabindex="-1">
          <section class="workspace-content" aria-labelledby="workspace-heading">
            <h1 id="workspace-heading"></h1>
            <p class="workspace-description"></p>
            <ol class="fixture-list" aria-label="Neutral overflow fixture"></ol>
          </section>
        </main>
      </div>
    </div>
    <script src="preview.js"></script>
  </body>
</html>
